name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 21 rather than 17: Robolectric needs Java 21 to run tests against API 35. The
      # bytecode still targets 17 (see compileOptions in app/build.gradle.kts).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Uses the committed wrapper (Gradle 8.9) and handles the dependency cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails the job if the SDK cannot be provisioned, instead of carrying on and failing
      # later with a less obvious error.
      - name: Install compileSdk 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found under \$ANDROID_HOME"; exit 1; }
          # `yes` dies of SIGPIPE when sdkmanager stops reading; under pipefail that
          # would fail the step, so its own exit status is ignored.
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null

      # Includes the Robolectric database and migration tests, so the data layer is covered
      # here without an emulator. The instrumented Compose test needs a device and is not run.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Style only — deliberately non-blocking until the baseline is clean.
      - name: ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
