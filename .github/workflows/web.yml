name: Web app

# Tests for the iPhone web version in web/. Kept apart from ci.yml (the Android build) so
# the two apps can change and ship independently.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  test:
    name: Web app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Parsers, shelf life, repository logic, the shared backup format and the offline
      # file list. No dependencies to install: plain node:test.
      - name: Unit tests
        working-directory: web
        run: node --test tests/*.test.js
