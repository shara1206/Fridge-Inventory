# Use a bare Application for Robolectric unit tests.
#
# The real FridgeApplication.onCreate() eagerly builds AppContainer -> ReceiptScanner ->
# ML Kit text recognition (com.google.android.gms play-services), which cannot initialize
# under Robolectric and made every DB / repository / migration test fail with
# IllegalStateException before the test body even ran. These tests only need a Context, so
# a plain android.app.Application is enough and avoids pulling in ML Kit.
application = android.app.Application
