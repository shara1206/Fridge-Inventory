name: Publish web app

# Publishes web/ to GitHub Pages whenever it changes on main. One-time setup in the repo:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test before publishing
        working-directory: web
        run: node --test tests/*.test.js
      # Only the app itself goes out; tests and package.json stay in the repo.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r web/index.html web/styles.css web/manifest.webmanifest web/sw.js \
            web/js web/icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
